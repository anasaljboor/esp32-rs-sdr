[package]
edition      = "2024"
name         = "esp-sdr-rs"
rust-version = "1.95"
version      = "0.1.0"
license      = "GPL-3.0-or-later"
description  = "ESP-SDR burst receiver for the ESP32-S3, written in Rust on esp-hal"

[[bin]]
name = "esp-sdr-rs"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
sdr-core = { path = "../sdr-core" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32s3", "unstable", "wifi", "sniffer"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
critical-section = "1.2.0"

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
